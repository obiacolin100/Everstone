<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>STARK | Elite Banking</title>
    <meta name="description" content="STARK — Secure, intelligent, elite digital banking." />
    <meta name="theme-color" content="#131313" id="theme-color" />
    <!-- Favicon: STARK gold S -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Inter (dark theme) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Libre Caslon Text + Hanken Grotesk (light theme) -->
    <link
      href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:ital,wght@0,400;0,700;1,400&family=Hanken+Grotesk:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <!-- Material Symbols Outlined -->
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&display=swap"
      rel="stylesheet"
    />
    <script>
      // Prevent flash of wrong theme
      (function() {
        try {
          const savedTheme = localStorage.getItem('stark-theme');
          const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
          const theme = savedTheme || (prefersLight ? 'light' : 'dark');
          document.documentElement.classList.add(theme);
          
          // Update theme-color meta tag
          const themeColor = document.getElementById('theme-color');
          if (themeColor) {
            themeColor.content = theme === 'light' ? '#fafafa' : '#131313';
          }
        } catch (e) {
          console.error('Theme initialization error:', e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    s1.charset='UTF-8';
    s1.setAttribute('crossorigin','*');
    s0.parentNode.insertBefore(s1,s0);

  </body>
</html>
